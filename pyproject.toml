[project]
name = "inspire-mcp-more"
version = "0.1.1"
description = "An extensible MCP server for the INSPIRE REST API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "inspire-mcp-more contributors" },
]
dependencies = [
    "httpx2>=2.5,<3",
    "mcp>=2.0,<3",
    "pydantic>=2.12,<3",
]

[project.scripts]
inspire-mcp = "inspire_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inspire_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["inspire_mcp"]
